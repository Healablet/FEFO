services:
  postgres:
    image: postgres:17-alpine
    container_name: farmacontrol-postgres
    environment:
      POSTGRES_DB: farmacontrol
      POSTGRES_USER: farmacontrol
      POSTGRES_PASSWORD: farmacontrol
    ports:
      - "5432:5432"
    volumes:
      - farmacontrol-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacontrol -d farmacontrol"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  farmacontrol-postgres-data:
